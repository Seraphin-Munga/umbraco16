# Pipeline for src/AcfAfricanbank.Web (the Umbraco "Production API" backend,
# which project-references src/AcfAfricanbank.Core). Only runs when either
# project, or the solution file, changes. See .gitlab-ci.yml for the shared
# stage list and the CI/CD variables every job below relies on.
.backend_changes: &backend_changes
  - src/AcfAfricanbank.Web/**/*
  - src/AcfAfricanbank.Core/**/*
  - AcfAfricanbank.sln

.backend_docker_login: &backend_docker_login
  - docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME -p $ACR_PASSWORD

.backend_azure_login: &backend_azure_login
  - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID

# ============================================================
# DEV pipeline: build + unit tests
# ============================================================
backend:build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  rules:
    - changes: *backend_changes
  script:
    - dotnet restore AcfAfricanbank.sln
    - dotnet build AcfAfricanbank.sln -c Release --no-restore
    # No test project exists under src/ yet - once one is added, this
    # picks it up automatically (dotnet test is a no-op, not a failure,
    # against a solution with no test projects).
    - dotnet test AcfAfricanbank.sln -c Release --no-build

# ============================================================
# Docker image (built + pushed to ACR under a "dev-<sha>" tag)
# ============================================================
backend:docker-dev:
  stage: docker-dev
  image: docker:24.0.5
  services: [docker:24.0.5-dind]
  variables:
    BACKEND_IMAGE: $ACR_LOGIN_SERVER/acf-backend
  rules:
    - changes: *backend_changes
      if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - *backend_docker_login
    # Build context is the repo root, not src/AcfAfricanbank.Web - see the
    # Dockerfile's own comment (AcfAfricanbank.Core is a project reference).
    - docker build -f src/AcfAfricanbank.Web/Dockerfile -t $BACKEND_IMAGE:dev-$CI_COMMIT_SHORT_SHA .
    - docker push $BACKEND_IMAGE:dev-$CI_COMMIT_SHORT_SHA

# ============================================================
# DEV environment deploy
# ============================================================
backend:deploy-dev:
  stage: deploy-dev
  image: mcr.microsoft.com/azure-cli
  variables:
    BACKEND_IMAGE: $ACR_LOGIN_SERVER/acf-backend
  rules:
    - changes: *backend_changes
      if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: dev/backend
  script:
    - *backend_azure_login
    - >
      az webapp config container set
      --name "$AZURE_WEBAPP_BACKEND_DEV"
      --resource-group "$AZURE_RESOURCE_GROUP"
      --docker-custom-image-name "$BACKEND_IMAGE:dev-$CI_COMMIT_SHORT_SHA"
      --docker-registry-server-url "https://$ACR_LOGIN_SERVER"
      --docker-registry-server-user "$ACR_USERNAME"
      --docker-registry-server-password "$ACR_PASSWORD"

# ============================================================
# Testing/QA gate - manual sign-off before a release can be cut.
# Replace the echo with real integration/smoke tests once they exist.
# ============================================================
backend:qa:
  stage: qa
  image: alpine:3.20
  rules:
    - changes: *backend_changes
      if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - echo "QA sign-off recorded for $CI_COMMIT_SHORT_SHA"

# ============================================================
# PUBLISH pipeline: rebuilds and tags the release image. Only runs off a
# release tag.
# ============================================================
backend:publish:
  stage: publish
  image: docker:24.0.5
  services: [docker:24.0.5-dind]
  variables:
    BACKEND_IMAGE: $ACR_LOGIN_SERVER/acf-backend
  rules:
    - changes: *backend_changes
      if: '$CI_COMMIT_TAG'
  script:
    - *backend_docker_login
    - >
      docker build -f src/AcfAfricanbank.Web/Dockerfile
      -t $BACKEND_IMAGE:$CI_COMMIT_TAG
      -t $BACKEND_IMAGE:latest
      .
    - docker push $BACKEND_IMAGE:$CI_COMMIT_TAG
    - docker push $BACKEND_IMAGE:latest

# ============================================================
# PRODUCTION deploy - manual trigger on a release tag.
# ============================================================
backend:deploy-production:
  stage: deploy-production
  image: mcr.microsoft.com/azure-cli
  variables:
    BACKEND_IMAGE: $ACR_LOGIN_SERVER/acf-backend
  rules:
    - changes: *backend_changes
      if: '$CI_COMMIT_TAG'
      when: manual
  environment:
    name: production/backend
  script:
    - *backend_azure_login
    - >
      az webapp config container set
      --name "$AZURE_WEBAPP_BACKEND_PROD"
      --resource-group "$AZURE_RESOURCE_GROUP"
      --docker-custom-image-name "$BACKEND_IMAGE:$CI_COMMIT_TAG"
      --docker-registry-server-url "https://$ACR_LOGIN_SERVER"
      --docker-registry-server-user "$ACR_USERNAME"
      --docker-registry-server-password "$ACR_PASSWORD"
