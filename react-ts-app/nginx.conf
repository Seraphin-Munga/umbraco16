server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom's BrowserRouter (see src/App.tsx) needs every path to
    # fall back to index.html so client-side routing can take over - a plain
    # static root would 404 on a direct load of e.g. /en/home/banking/.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend isn't reachable on its own port from outside this host's
    # network, so the frontend calls it through this same origin instead -
    # proxied here, container-to-container, over the shared umbraco-net
    # network (see VITE_UMBRACO_API_BASE_URL="" in docker-compose.yml).
    # ^~ stops the static-asset regex location below from grabbing
    # /media/*.jpg requests before they reach the backend.
    # $host drops the port, so the backend would see "Host: 10.2.15.48"
    # instead of "10.2.15.48:8070" and compute its own callback URLs
    # without the port - mismatching the real redirect_uri the browser
    # sends and making OpenIddict reject backoffice login (ID2043).
    # $http_host preserves the port exactly as the browser sent it.
    location ^~ /umbraco/ {
        proxy_pass http://umbraco-backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backoffice login/authorize responses carry large auth cookies/headers
        # that exceed nginx's default 4k/8k buffer, causing "upstream sent too
        # big header" 502s right after login - these need to be bigger.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    location ^~ /media/ {
        proxy_pass http://umbraco-backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
