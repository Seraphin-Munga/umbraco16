<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-ts-app</title>
    <!--
      Copied from AcfAfricanbank.Web/wwwroot/css, matching what MasterNew.cshtml
      actually loads for the homepage (confirmed via PageHome.cshtml's Layout):
      Bootstrap 4 + style.css (site-wide: footer, search, etc.) + media-query.css
      (responsive overrides). navigation.css isn't in MasterNew.cshtml's own
      <head> but is the only place header-mega-menu/navbar-default/nav-modal/
      register-btn/login-btn are styled at all, so it's kept regardless. Font
      Awesome (4.x, matching font-awesome-4-1-0 loaded server-side) supplies
      fa-search/fa-angle-down/fa-facebook/fa-twitter/fa-instagram/fa-linkedin.
    -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <!--
      Bootstrap 4 dropped several Bootstrap-3-only utility classes the ported
      markup still uses (hidden-xs/sm/md/lg, visible-xs, pull-right, the
      col-sm-push/pull grid modifiers) - loaded last so it isn't overridden
      by the stylesheets above. See the file itself for the full story.
    -->
  
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
